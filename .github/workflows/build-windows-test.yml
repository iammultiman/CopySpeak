name: Build X-CopySpeak Windows Test Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - ".github/workflows/build-windows-test.yml"
      - "package.json"
      - "src/lib/version.ts"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install dependencies
        run: |
          bun install
          bun install --cwd browser-extension
      - name: Check frontend
        run: bun run check
      - name: Test frontend
        run: bun run test
      - name: Build unsigned Windows installer
        shell: pwsh
        run: |
          bun run tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows-test.conf.json
      - name: Upload test executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: X-CopySpeak-${{ steps.version.outputs.version }}-Windows-x64-${{ github.run_number }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/copyspeak.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
